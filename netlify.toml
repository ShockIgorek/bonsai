[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 требует Node ^20.19.0 || >=22.12.0
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# index.html и sw.js не должны залипать в кеше Netlify:
# иначе телефон продолжает видеть старую версию приложения.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
